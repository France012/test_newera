version: 2

updates:
  # Maven — the three Spring Boot services share the root aggregator POM.
  - package-ecosystem: maven
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      spring:
        patterns:
          - 'org.springframework*'
          - 'io.spring*'

  # Frontend dependencies.
  - package-ecosystem: npm
    directory: '/frontend'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'

  # Workflow actions.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns:
          - '*'

  # Container base images referenced by infra/docker/*.Dockerfile.
  - package-ecosystem: docker
    directory: '/infra/docker'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
