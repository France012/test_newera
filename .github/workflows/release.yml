name: Release

# AC-13 — semantic-release: tag vX.Y.Z, CHANGELOG.md and GitHub Release
# from Conventional Commits. ADR-0004: the VERSION file and the pom.xml
# version are NOT bumped automatically; see docs/versioning.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          branches: |
            ['main']
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
