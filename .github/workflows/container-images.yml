name: Container images

# AC-8 (multi-stage build), AC-9 (signed images), AC-10 (CycloneDX SBOM artefacts).
# ADR-0007: unprivileged runtime images + wget healthcheck.
# ADR-0011: GHCR path lowercased, provenance attested explicitly (not by BuildKit).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing (OIDC)
  attestations: write # actions/attest-build-provenance

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-attest:
    name: Build + SBOM + sign (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-app
            dockerfile: infra/docker/core-app.Dockerfile
          - service: document-service
            dockerfile: infra/docker/document-service.Dockerfile
          - service: bff
            dockerfile: infra/docker/bff.Dockerfile
          - service: frontend
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR rejects uppercase names: France012/test_newera must be lowercased.
      - name: Compute image base
        shell: bash
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO=$(echo '${{ github.repository }}' | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_BASE=ghcr.io/${OWNER}/${REPO}" >> "$GITHUB_ENV"
          echo "Image base: ghcr.io/${OWNER}/${REPO}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pitfall P-3: without this BuildKit returns the digest of a manifest
          # list and cosign would sign an object verifiers do not expect.
          provenance: false

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_BASE }}/${{ matrix.service }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM artefact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 30

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        shell: bash
        run: |
          cosign sign --yes \
            "${IMAGE_BASE}/${{ matrix.service }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom-platform:
    name: Maven aggregate SBOM (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # Fully qualified goal: the plugin is only declared in pluginManagement,
      # so the `cyclonedx:` prefix would not resolve.
      - name: Generate aggregate SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.8.0:makeAggregateBom

      - name: Upload aggregate SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-claims-platform
          path: '**/target/sbom-claims-platform.json'
          retention-days: 30
          if-no-files-found: error
