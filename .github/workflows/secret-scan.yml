name: Secret scan

# AC-7 — ADR-0010: gitleaks over the full history. The deterministic `grep`
# gate inside ci.yml stays the always-on safety net, so a missing
# GITLEAKS_LICENSE can never silence secret scanning completely.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 3' # Wednesdays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth 0 is mandatory: gitleaks scans every commit.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: only required for private repositories in an organisation.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Fallback pattern gate (always runs)
        if: always()
        shell: bash
        run: |
          MATCHES=$(grep -rniE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=target \
            --exclude-dir=dist || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Potential secret found in the working tree"
            echo "$MATCHES"
            exit 1
          fi
          echo "No secret pattern found."
