# =============================================================================
# core-app — runtime configuration (port 8180)
# -----------------------------------------------------------------------------
# NO SECRET IS EVER WRITTEN HERE (acceptance criterion AC-12): credentials are
# read from environment variables, placeholders are documented in .env.example.
#
# Persistence contract (docs/db/README.md §6):
#   * Flyway owns the schema ("coreapp"), Hibernate only validates it.
#   * ddl-auto=validate in EVERY profile: create/update must never be used.
# =============================================================================
server:
  port: 8180
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: core-app

  datasource:
    url: ${CORE_APP_DB_URL:jdbc:postgresql://localhost:5442/claims}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${CORE_APP_DB_POOL_SIZE:10}
      pool-name: core-app-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: coreapp
    default-schema: coreapp
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: coreapp
        jdbc:
          time_zone: UTC

  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
