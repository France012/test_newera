# =============================================================================
# core-app — "local" profile (developer machine, PostgreSQL from infra/docker-compose)
# -----------------------------------------------------------------------------
# Activated with --spring.profiles.active=local. Adds SQL visibility only:
# no credential, no URL with a real host, no behaviour change.
# =============================================================================
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    it.enterprise.claims.core: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
