# =============================================================================
# document-service — runtime configuration (port 8181)
# -----------------------------------------------------------------------------
# NO SECRET IS EVER WRITTEN HERE (AC-12): credentials come from environment
# variables, placeholders are documented in .env.example.
#
# Persistence contract (docs/db/README.md §6): Flyway owns schema "documents",
# Hibernate only validates it (ddl-auto=validate, no create/update anywhere).
#
# In dev both services share one PostgreSQL instance (different schemas); in
# production each service gets its own instance, hence the separate URL var.
# =============================================================================
server:
  port: 8181
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: document-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB
      file-size-threshold: 1MB

  datasource:
    url: ${DOCUMENT_SERVICE_DB_URL:jdbc:postgresql://localhost:5442/claims}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DOCUMENT_SERVICE_DB_POOL_SIZE:10}
      pool-name: document-service-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: documents
    default-schema: documents
    baseline-on-migrate: false
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: documents
        jdbc:
          time_zone: UTC

  mvc:
    problemdetails:
      enabled: true

# Content store (DocumentStoragePort). Local filesystem in phase 1; S3 later.
documents:
  storage:
    path: ${DOCUMENTS_STORAGE_PATH:./target/storage}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
