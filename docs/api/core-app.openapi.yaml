openapi: 3.0.3

# =============================================================================
# claims-platform — core-app HTTP contract (blueprint §2.3)
# -----------------------------------------------------------------------------
# Hand-written contract, aligned 1:1 with the implemented controllers:
#   core-app/src/main/java/it/enterprise/claims/core/adapter/in/web/ClaimController.java
#   core-app/src/main/java/it/enterprise/claims/core/adapter/in/web/PolicyController.java
#   core-app/src/main/java/it/enterprise/claims/core/adapter/in/web/RoleController.java
#   core-app/src/main/java/it/enterprise/claims/core/adapter/in/web/ActorController.java
#   core-app/src/main/java/it/enterprise/claims/core/adapter/in/web/ClaimAssignmentController.java
#   core-app/src/main/java/it/enterprise/claims/core/adapter/in/web/ClaimAuditEventController.java
# The runtime document is generated by springdoc at /v3/api-docs; this file is the
# REVIEWED snapshot the frontend and the BFF are written against (ADR-0009).
#
# Scope of phase 1: NO authentication on these endpoints (ADR-0005). The `security`
# block is therefore intentionally empty and must not be extended with a placeholder.
# =============================================================================

info:
  title: claims-platform — core-app API
  version: 0.2.0
  description: |
    Claims and policies API of the `core-app` service (port 8180).

    Error responses are RFC 9457 `application/problem+json` documents produced by
    `GlobalExceptionHandler` (`type` defaults to `about:blank`, `instance` is the request URI).

    Status transitions are enforced by the service layer. An illegal transition returns
    `409 Conflict` with `title: "Illegal claim status transition"`.

    Since 0.2.0 the contract also publishes the actors/roles registry, the per-claim role
    assignments and the append-only audit trail of a claim (ticket TK-64FBC8).
  contact:
    name: claims-platform maintainers
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8180
    description: Local development (blueprint §2.9, non-standard port on purpose)

security: []

tags:
  - name: Claims
    description: Claim lifecycle and status state machine
  - name: Policies
    description: Read-only view of the policies a claim can be opened on
  - name: Actors and roles
    description: Registry of the actors (internal/external/system) and of the roles they hold
  - name: Assignments
    description: Actors assigned to a claim, one active holder per role
  - name: Audit
    description: Append-only audit trail of a claim
  - name: Actuator
    description: Liveness/readiness probes

paths:
  /api/v1/claims:
    get:
      tags: [Claims]
      operationId: listClaims
      summary: List claims, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          description: Exact status filter; omitted means "any status".
          schema:
            $ref: '#/components/schemas/ClaimStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          required: false
          description: |
            Sort expression `property,direction`. Sortable properties:
            `openedAt`, `updatedAt`, `claimNumber`, `status`, `incidentDate`.
            `createdAt` is accepted as an alias of `openedAt`; an unknown property
            falls back to `openedAt` instead of failing.
          schema:
            type: string
            default: openedAt,desc
            example: openedAt,desc
      responses:
        '200':
          description: One page of claims, newest first by default.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Claims]
      operationId: openClaim
      summary: Open a claim on an existing policy
      description: |
        Creates the claim in `DRAFT` and appends the first `claim_status_history` row.
        The `policyNumber` must exist, otherwise `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimCreateRequest'
      responses:
        '201':
          description: Claim created.
          headers:
            Location:
              description: Absolute URI of the created claim.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}:
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get a claim by id
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: The claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}/status:
    patch:
      tags: [Claims]
      operationId: changeClaimStatus
      summary: Change the status of a claim (state machine enforced)
      description: |
        Allowed transitions only:
        `DRAFT→SUBMITTED`, `SUBMITTED→UNDER_REVIEW`,
        `UNDER_REVIEW→INTEGRATION_REQUESTED|APPROVED|REJECTED`,
        `INTEGRATION_REQUESTED→UNDER_REVIEW`, `APPROVED|REJECTED→CLOSED`.
        Any other transition returns `409` and leaves the claim unchanged.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimStatusUpdateRequest'
      responses:
        '200':
          description: The updated claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Illegal transition; `detail` lists the allowed target states.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Illegal claim status transition
                status: 409
                detail: 'Cannot move claim from CLOSED to UNDER_REVIEW; allowed: none'
                instance: /api/v1/claims/7f2f9d0e-8c5e-4a51-9a3f-3d8b6a1c9e21/status

  /api/v1/claims/{claimId}/status-history:
    get:
      tags: [Claims]
      operationId: getClaimStatusHistory
      summary: Chronological audit trail of the claim status transitions
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Transitions in chronological order (oldest first), no pagination.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimStatusHistoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}/documents:
    post:
      tags: [Claims]
      operationId: attachClaimDocuments
      summary: Attach document-service documents to a claim (idempotent)
      description: |
        Only stores the logical link (`claim_documents`). No call to document-service is made:
        `document-service` owns the metadata, `core-app` owns the relationship.
        Re-sending an already linked id is a no-op.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIdsRequest'
      responses:
        '200':
          description: The claim with the complete list of attached documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List policies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: policyNumber,asc
      responses:
        '200':
          description: One page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/policies/{policyId}:
    get:
      tags: [Policies]
      operationId: getPolicy
      summary: Get a policy by id
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/roles:
    get:
      tags: [Actors and roles]
      operationId: listRoles
      summary: List the roles of the catalogue
      description: |
        The role catalogue is seeded by `V2__claim_workflow_actors_audit.sql`
        (`coreapp.roles`); it is read-only through the API.
      responses:
        '200':
          description: All roles, ordered by code.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'

  /api/v1/actors:
    get:
      tags: [Actors and roles]
      operationId: listActors
      summary: List actors, optionally filtered by role, type and status
      parameters:
        - name: role
          in: query
          required: false
          description: Exact role code the actor must hold, e.g. `CLAIMS_OFFICER`.
          schema:
            type: string
        - name: actorType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ActorType'
        - name: enabled
          in: query
          required: false
          description: Filter on the enabled flag; omitted means "any".
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          required: false
          description: |
            Sort expression `property,direction`. Sortable properties: `displayName`,
            `subjectRef`, `createdAt`; an unknown property falls back to `displayName`.
          schema:
            type: string
            default: displayName,asc
      responses:
        '200':
          description: One page of actors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Actors and roles]
      operationId: registerActor
      summary: Register an actor
      description: |
        `subjectRef` is the unique business key of the actor (an external identity reference);
        registering it twice returns `409` with `title: "Actor already registered"`.
        Every role code in `roleCodes` must exist in the catalogue, otherwise `400`
        (`title: "Unknown role"`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorCreateRequest'
      responses:
        '201':
          description: Actor registered.
          headers:
            Location:
              description: Absolute URI of the created actor.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/actors/{actorId}:
    get:
      tags: [Actors and roles]
      operationId: getActor
      summary: Get an actor by id
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The actor with its role codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Actors and roles]
      operationId: updateActor
      summary: Update the mutable fields of an actor
      description: |
        Partial update: a `null` field is left untouched. `subjectRef` and `actorType` are
        immutable by design.
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorUpdateRequest'
      responses:
        '200':
          description: The updated actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/actors/{actorId}/roles:
    put:
      tags: [Actors and roles]
      operationId: replaceActorRoles
      summary: Replace the whole role set of an actor
      description: |
        Full replacement, so the call is idempotent. An unknown role code returns `400`
        (`title: "Unknown role"`).
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorRolesUpdateRequest'
      responses:
        '200':
          description: The actor with its new role codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}/assignments:
    get:
      tags: [Assignments]
      operationId: listClaimAssignments
      summary: List the assignments of a claim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: activeOnly
          in: query
          required: false
          description: When `true` (default) only the current holders are returned.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: The assignments, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimAssignmentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}/assignments/{roleCode}:
    put:
      tags: [Assignments]
      operationId: assignActor
      summary: Assign an actor to a claim in a role
      description: |
        `PUT`, not `POST`: there is at most one active holder per `(claim, role)`, so the call
        replaces the current holder and is idempotent. A disabled actor returns `409`
        (`title: "Invalid assignment"`); an unknown role code returns `400`
        (`title: "Unknown role"`).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
            example: CLAIMS_OFFICER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimAssignmentRequest'
      responses:
        '200':
          description: The active assignment for that role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimAssignmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Assignments]
      operationId: unassignActor
      summary: Close the active assignment of a role
      description: Idempotent; the assignment is closed (`unassignedAt`), never deleted.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: roleCode
          in: path
          required: true
          schema:
            type: string
            example: CLAIMS_OFFICER
      responses:
        '204':
          description: The role no longer has an active holder.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}/audit-events:
    get:
      tags: [Audit]
      operationId: listClaimAuditEvents
      summary: List the audit trail of a claim
      description: |
        Append-only trail written by the services. Results are newest first, served by the
        index `idx_audit_events_claim` on `(claim_id, occurred_at desc)`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: eventType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditEventType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/claims/{claimId}/documents/{documentId}:
    delete:
      tags: [Claims]
      operationId: detachDocument
      summary: Unlink a document from a claim
      description: |
        Unlinks the document from the claim and appends a `CLAIM_DOCUMENT_UNLINKED` audit event.
        **The document itself is not deleted**: document-service stays the owner of the record and
        of its retention policy.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The document is no longer linked to the claim.
        '404':
          $ref: '#/components/responses/NotFound'

  /actuator/health:
    get:
      tags: [Actuator]
      operationId: health
      summary: Liveness and readiness probe
      responses:
        '200':
          description: Service is UP.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
        '503':
          description: Service is DOWN (a dependency failed).

components:
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. Negative values are clamped to 0.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size, clamped to the 1..100 range.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid payload, parameter or illegal argument.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    ClaimStatus:
      type: string
      description: |
        Single source of truth is the java enum `ClaimStatus`; the values are mirrored by the
        CHECK constraints `ck_claims_status` (`V1__init_claims.sql`) and
        `ck_claim_status_history_statuses` (`V2__claim_workflow_actors_audit.sql`).

        Declaration order is the lifecycle order. Italian (business) meaning in brackets.
        Allowed transitions are declared once in `ClaimStatus.allowedTransitions()`, seeded into
        `coreapp.claim_status_transition` and enforced twice: by the application (`409` before the
        write) and by the database (composite FK from `claim_status_history`).

        `APPROVED -> CLOSED` is deliberately NOT allowed: the settlement step cannot be skipped.
      enum:
        - DRAFT
        - SUBMITTED
        - UNDER_REVIEW
        - INTEGRATION_REQUESTED
        - APPRAISAL
        - APPROVED
        - REJECTED
        - SETTLEMENT
        - CLOSED
        - ARCHIVED
      x-enum-descriptions:
        - aperta (in compilazione)
        - inviata / presa in carico
        - in istruttoria
        - istruttoria sospesa, in attesa di integrazione
        - perizia
        - delibera favorevole
        - respinta
        - liquidazione
        - chiusa
        - archiviata (terminale)

    ClaimResponse:
      type: object
      required:
        - id
        - claimNumber
        - policyNumber
        - customerId
        - claimType
        - status
        - incidentDate
        - openedAt
        - updatedAt
        - documentIds
      properties:
        id:
          type: string
          format: uuid
        claimNumber:
          type: string
          example: CLM-2024-000123
        policyNumber:
          type: string
          example: POL-2024-000456
        customerId:
          type: string
          format: uuid
        claimType:
          type: string
          example: MOTOR_DAMAGE
        status:
          $ref: '#/components/schemas/ClaimStatus'
        description:
          type: string
          nullable: true
          maxLength: 2000
        incidentDate:
          type: string
          format: date
        openedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        documentIds:
          type: array
          description: Ids returned by document-service and linked to this claim.
          items:
            type: string
            format: uuid
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Set by the transition into `CLOSED` (`claims.closed_at`, guarded by
            `ck_claims_closed_at` in `V2__claim_workflow_actors_audit.sql`). `null` while open.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Set by the transition into `ARCHIVED` (`claims.archived_at`, guarded by
            `ck_claims_archived_at`). `null` until the claim is archived.

    ClaimCreateRequest:
      type: object
      required:
        - policyNumber
        - claimType
        - incidentDate
      properties:
        policyNumber:
          type: string
          minLength: 1
          maxLength: 32
        customerId:
          type: string
          format: uuid
          nullable: true
          description: Ignored when the policy already identifies the customer.
        claimType:
          type: string
          minLength: 1
          maxLength: 32
          example: MOTOR_DAMAGE
        description:
          type: string
          maxLength: 2000
          nullable: true
        incidentDate:
          type: string
          format: date
          description: Must not be in the future.

    ClaimStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Free-text note stored in `claim_status_history.note`.
        actorId:
          type: string
          format: uuid
          nullable: true
          description: |
            Optional actor asserting the transition; stored in `claim_status_history.changed_by`
            and carried by the `CLAIM_STATUS_CHANGED` audit event. An unknown id returns `404`
            (`title: "Actor not found"`).

    ClaimStatusHistoryResponse:
      type: object
      required: [id, toStatus, changedAt]
      properties:
        id:
          type: string
          format: uuid
        fromStatus:
          allOf:
            - $ref: '#/components/schemas/ClaimStatus'
          nullable: true
          description: Null for the first entry (claim creation).
        toStatus:
          $ref: '#/components/schemas/ClaimStatus'
        note:
          type: string
          nullable: true
        changedAt:
          type: string
          format: date-time

    DocumentIdsRequest:
      type: object
      required: [documentIds]
      properties:
        documentIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid

    ClaimPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ClaimResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PolicyResponse:
      type: object
      required: [id, policyNumber, customerId, productCode, validFrom, validTo, premium]
      properties:
        id:
          type: string
          format: uuid
        policyNumber:
          type: string
        customerId:
          type: string
          format: uuid
        productCode:
          type: string
          example: MOTOR_BASIC
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        premium:
          type: number
          format: bigdecimal
          example: 349.90

    PolicyPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PolicyResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    Problem:
      type: object
      description: RFC 9457 problem detail as emitted by Spring's `ProblemDetail`.
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          example: Claim not found
        status:
          type: integer
          format: int32
          example: 404
        detail:
          type: string
        instance:
          type: string
          format: uri
          example: /api/v1/claims/7f2f9d0e-8c5e-4a51-9a3f-3d8b6a1c9e21
        errors:
          type: object
          additionalProperties:
            type: string
          description: Present only for bean-validation failures (field -> message).

    RoleResponse:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: CLAIMS_OFFICER
        name:
          type: string
          example: Istruttore
        description:
          type: string
          nullable: true

    ActorType:
      type: string
      description: Mirrors the java enum `ActorType` and the CHECK constraint on `actors.actor_type`.
      enum: [INTERNAL, EXTERNAL, SYSTEM]

    ActorResponse:
      type: object
      required:
        - id
        - subjectRef
        - displayName
        - actorType
        - enabled
        - roleCodes
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        subjectRef:
          type: string
          description: External identity reference, unique `actors.subject_ref`.
          maxLength: 128
        displayName:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          nullable: true
        actorType:
          $ref: '#/components/schemas/ActorType'
        enabled:
          type: boolean
          description: A disabled actor can hold history but cannot be assigned.
        roleCodes:
          type: array
          description: Sorted role codes held by the actor.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ActorCreateRequest:
      type: object
      required: [subjectRef, displayName, actorType]
      properties:
        subjectRef:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[A-Za-z0-9._:@|/-]{3,128}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        actorType:
          $ref: '#/components/schemas/ActorType'
        roleCodes:
          type: array
          description: Optional initial role set; unknown codes return `400 "Unknown role"`.
          maxItems: 10
          nullable: true
          items:
            type: string

    ActorUpdateRequest:
      type: object
      description: Partial update, a `null` field is left untouched.
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        email:
          type: string
          format: email
          maxLength: 255
          nullable: true
        enabled:
          type: boolean
          nullable: true

    ActorRolesUpdateRequest:
      type: object
      description: Full replacement of the role set of an actor.
      required: [roleCodes]
      properties:
        roleCodes:
          type: array
          maxItems: 10
          items:
            type: string

    ActorPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ActorResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ClaimAssignmentRequest:
      type: object
      required: [actorId]
      properties:
        actorId:
          type: string
          format: uuid

    ClaimAssignmentResponse:
      type: object
      required:
        - id
        - claimId
        - actorId
        - actorDisplayName
        - roleCode
        - assignedAt
      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorDisplayName:
          type: string
        roleCode:
          type: string
          example: CLAIMS_OFFICER
        assignedAt:
          type: string
          format: date-time
        assignedByActorId:
          type: string
          format: uuid
          nullable: true
        unassignedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the assignment is closed; never a hard delete.

    AuditEventType:
      type: string
      description: Mirrors the java enum `AuditEventType` and the CHECK on `audit_events.event_type`.
      enum:
        - CLAIM_OPENED
        - CLAIM_STATUS_CHANGED
        - CLAIM_DOCUMENT_LINKED
        - CLAIM_DOCUMENT_UNLINKED
        - CLAIM_ASSIGNED
        - CLAIM_UNASSIGNED
        - ACTOR_CREATED
        - ACTOR_ROLES_CHANGED

    AuditEventResponse:
      type: object
      required: [id, eventType, entityType, entityId, outcome, occurredAt, details]
      properties:
        id:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
          nullable: true
        actorId:
          type: string
          format: uuid
          nullable: true
        eventType:
          $ref: '#/components/schemas/AuditEventType'
        entityType:
          type: string
          example: CLAIM
        entityId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [SUCCESS, FAILURE]
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          nullable: true
        details:
          type: object
          description: Free-form, non-secret payload of the event.
          additionalProperties: true

    AuditEventPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
